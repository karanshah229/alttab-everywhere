name: Release

# Push a tag like v0.6.0 to build the zips and open a draft GitHub release.
# Nothing is published until someone reviews the draft and publishes it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test -c Release
      - name: Build zips, checksums and winget manifests
        shell: pwsh
        run: ./tools/release/build-release.ps1 -Version "${{ github.ref_name }}".TrimStart('v') -Output artifacts
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem artifacts -File).FullName
          gh release create "${{ github.ref_name }}" @files --draft --generate-notes --title "AltTab Everywhere ${{ github.ref_name }}"
      - name: Keep the winget manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: artifacts/winget
