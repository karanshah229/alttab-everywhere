name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Unit tests
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
      - name: Native build (NativeAOT)
        # install.ps1 and the releases compile the switcher to native code: make sure it still does,
        # with no trimming or AOT warnings (reflection or runtime COM would break it at run time).
        run: dotnet publish src/AltTabEverywhere/AltTabEverywhere.csproj -c Release -r win-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true -o aot
